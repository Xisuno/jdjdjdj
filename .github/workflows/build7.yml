
name: Build DaemonDisabler DEB

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make ldid dpkg

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$HOME/theos/sdks"
          cp -R /tmp/sdks/iPhoneOS*.sdk "$HOME/theos/sdks/"

      - name: Locate Makefile
        run: |
          FILE=$(find . -name Makefile -not -path './.git/*' -print -quit)

          if [ -z "$FILE" ]; then
            echo "::error::No Makefile found in repository"
            find . -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found: $FILE"

      - name: Build DEB
        run: |
          cd "$PROJECT_DIR"
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/bin:$PATH"

          gmake clean || true
          gmake package FINALPACKAGE=1 ARCHS="arm64 arm64e"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: DaemonDisabler-DEB
          path: "**/packages/*.deb"
          if-no-files-found: error
