
name: Build DaemonDisabler DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make ldid dpkg

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          git clone https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$HOME/theos/sdks"
          cp -R /tmp/sdks/iPhoneOS*.sdk "$HOME/theos/sdks/"

      - name: Build package
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          make clean || true
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: DaemonDisabler-DEB
          path: packages/*.deb
          if-no-files-found: error
